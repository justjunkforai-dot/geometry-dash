<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07041a">
  <meta name="description" content="Neon Dash — a one-button neon rhythm platformer with a level editor.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%221%22 y=%221%22 width=%2214%22 height=%2214%22 rx=%222%22 fill=%22%237dff4f%22 stroke=%22%2307041a%22 stroke-width=%222%22/%3E%3Crect x=%225%22 y=%225%22 width=%226%22 height=%226%22 fill=%22%233dd6ff%22/%3E%3C/svg%3E">
  <title>Neon Dash</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <main id="stage" aria-label="Neon Dash">
    <canvas id="game" role="img" aria-label="Game view"></canvas>
    <div id="ui"></div>
    <div id="transition" aria-hidden="true"></div>
  </main>
  <div id="rotate-hint" role="status" hidden>
    <p>Rotate your device to landscape for the best experience.</p>
    <button type="button" id="rotate-dismiss">Play anyway</button>
  </div>
  <noscript><p class="noscript">Neon Dash needs JavaScript enabled.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
